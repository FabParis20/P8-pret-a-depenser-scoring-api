name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests automatisés
    runs-on: ubuntu-latest
    
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      
      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Installer Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Installer les dépendances
        run: poetry install
      
      - name: Lancer les tests
        run: poetry run pytest tests/test_api.py -v
        
  build:
    name: Build et Push Docker
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      
      - name: Login Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Construire l'image Docker
        run: docker build -t api-scoring-credit .
      
      - name: Tag image pour Docker Hub
        if: github.ref == 'refs/heads/main'
        run: docker tag api-scoring-credit ${{ secrets.DOCKER_USERNAME }}/api-scoring-credit:latest
      
      - name: Push vers Docker Hub
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/api-scoring-credit:latest
      
      - name: Vérifier que l'image existe localement
        run: docker images | grep api-scoring-credit